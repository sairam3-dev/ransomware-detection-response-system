services:
  api:
    build: .
    container_name: rdrs-api
    ports:
      - "8081:8081"
    environment:
      RDRS_DATABASE_PATH: /app/data/rdrs.db
      WATCHDOG_FORCE_POLLING: "true"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped

  dashboard:
    build: .
    container_name: rdrs-dashboard
    command:
      - streamlit
      - run
      - app/dashboard/dashboard.py
      - --server.address=0.0.0.0
      - --server.port=8501
    ports:
      - "8501:8501"
    environment:
      RDRS_DATABASE_PATH: /app/data/rdrs.db
      WATCHDOG_FORCE_POLLING: "true"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      - api
    restart: unless-stopped
